<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0c0e14"/>
    </linearGradient>
    <linearGradient id="mh-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="mh-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2433"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#mh-bg)"/>

  <!-- Subtle Grid Lines (Swiss Minimalist Editorial) -->
  <g stroke="#262f40" stroke-width="1" opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="560" y1="0" x2="560" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Central Mobile Device Mockup -->
  <g transform="translate(260, 60)">
    <!-- Phone Outer Body -->
    <rect x="0" y="0" width="280" height="380" rx="32" fill="url(#mh-card)" stroke="#374151" stroke-width="3"/>
    
    <!-- Phone Screen -->
    <rect x="12" y="16" width="256" height="348" rx="22" fill="#0d1117"/>
    
    <!-- Status / Speaker Bar -->
    <rect x="98" y="24" width="84" height="6" rx="3" fill="#30363d"/>

    <!-- App Header -->
    <text x="32" y="60" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">MUSICHUB</text>
    <rect x="220" y="48" width="24" height="18" rx="4" fill="#1f2937"/>
    <circle cx="232" cy="57" r="3" fill="#60a5fa"/>

    <!-- Album Art / Vinyl Graphic -->
    <circle cx="140" cy="145" r="54" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="140" cy="145" r="38" fill="#1f242c" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2"/>
    <circle cx="140" cy="145" r="16" fill="url(#mh-accent)"/>
    <circle cx="140" cy="145" r="6" fill="#0d1117"/>

    <!-- Track Title & Artist -->
    <text x="140" y="222" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600">Offline Audio Playback</text>
    <text x="140" y="238" text-anchor="middle" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="400">Media3 • ExoPlayer • Room DB</text>

    <!-- 5-Band Equalizer Frequency Bars -->
    <g transform="translate(50, 252)">
      <!-- Band 1: 60Hz -->
      <rect x="0" y="12" width="26" height="28" rx="4" fill="#3b82f6" opacity="0.8"/>
      <!-- Band 2: 230Hz -->
      <rect x="38" y="4" width="26" height="36" rx="4" fill="#60a5fa"/>
      <!-- Band 3: 910Hz -->
      <rect x="76" y="16" width="26" height="24" rx="4" fill="#818cf8"/>
      <!-- Band 4: 3.6kHz -->
      <rect x="114" y="0" width="26" height="40" rx="4" fill="#a78bfa"/>
      <!-- Band 5: 14kHz -->
      <rect x="152" y="8" width="26" height="32" rx="4" fill="#c084fc"/>
    </g>

    <!-- Player Controls -->
    <g transform="translate(70, 316)" fill="#e5e7eb">
      <!-- Previous -->
      <polygon points="26,10 16,16 26,22"/>
      <line x1="14" y1="10" x2="14" y2="22" stroke="#e5e7eb" stroke-width="2"/>
      <!-- Play/Pause Button Circle -->
      <circle cx="70" cy="16" r="16" fill="url(#mh-accent)"/>
      <polygon points="66,11 76,16 66,21" fill="#ffffff"/>
      <!-- Next -->
      <polygon points="114,10 124,16 114,22"/>
      <line x1="126" y1="10" x2="126" y2="22" stroke="#e5e7eb" stroke-width="2"/>
    </g>
  </g>

  <!-- Left Editorial Tag Box -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="160" height="70" rx="12" fill="#141923" stroke="#262f40" stroke-width="1.5"/>
    <text x="16" y="28" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">NATIVE ANDROID</text>
    <text x="16" y="50" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="500">Kotlin &amp; Compose</text>
  </g>

  <!-- Right Editorial Tag Box -->
  <g transform="translate(580, 270)">
    <rect x="0" y="0" width="160" height="70" rx="12" fill="#141923" stroke="#262f40" stroke-width="1.5"/>
    <text x="16" y="28" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">AUDIO SYSTEM</text>
    <text x="16" y="50" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="500">AndroidX Media3</text>
  </g>
</svg>
